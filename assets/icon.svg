<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4864a"/>
      <stop offset="1" stop-color="#d9531a"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- source shape -->
  <rect x="246" y="246" width="320" height="320" rx="44" fill="none" stroke="#f1efea" stroke-width="44"/>
  <!-- recast shape -->
  <circle cx="610" cy="610" r="176" fill="url(#dot)" stroke="#211e1b" stroke-width="22" paint-order="stroke"/>
</svg>
